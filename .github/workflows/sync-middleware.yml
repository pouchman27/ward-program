name: Sync clean ward middleware
on:
  workflow_dispatch:
  push:
    branches: [middleware-clean-sources]
    paths: [sync_job.py, sync_middleware.py, source_parser.py, mw_reader.py, clean_schema.py, .github/workflows/sync-middleware.yml]
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: ward-middleware-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Copy only public fields into private middleware
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 sync_job.py
      - name: Validate clean reader and encrypted preview (no publication)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WARD_SITE_PASSPHRASE: ${{ secrets.WARD_SITE_PASSPHRASE }}
        run: |
          ./build_site.sh
          test -s data.enc
          test -s cal-9541feda7b84bf953efa2cf47305248ec3ca90d9673d8fa1baea79aa47012831.ics
