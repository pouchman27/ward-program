name: Sync clean ward middleware
on:
  workflow_dispatch:
  push:
    branches: [middleware-clean-sources]
    paths: [sync_job.py, sync_middleware.py, source_parser.py, mw_reader.py, clean_schema.py, .github/workflows/sync-middleware.yml]
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: ward-middleware-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Copy only public fields into private middleware
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 sync_job.py
